<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Debug Error Test Page</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        color: #4b5563;
        line-height: 1.6;
      }

      .panel {
        margin-top: 24px;
        border: 1px solid #d7dce8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 18px;
        border-bottom: 1px solid #e5e7eb;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
        padding: 10px 14px;
      }

      button.secondary {
        background: #475569;
      }

      button.danger {
        background: #dc2626;
      }

      #log {
        display: grid;
        gap: 8px;
        margin: 0;
        min-height: 220px;
        padding: 18px;
        list-style: none;
      }

      #log li {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        background: #f8fafc;
        padding: 10px 12px;
        font-size: 13px;
      }

      .hint {
        margin-top: 14px;
        font-size: 13px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #18181b;
          color: #f4f4f5;
        }

        p {
          color: #cbd5e1;
        }

        .panel {
          border-color: #3f3f46;
          background: #27272a;
        }

        .toolbar {
          border-color: #3f3f46;
        }

        #log li {
          border-color: #3f3f46;
          background: #1f2937;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Debug Error Test Page</h1>
      <p>
        Electron 디버깅 브라우저에서 Start Trace를 누른 뒤 아래 버튼을 실행하면
        console error, window error, unhandled rejection, failed API, DOM mutation이 함께 발생합니다.
      </p>

      <section class="panel">
        <div class="toolbar">
          <button class="danger" id="run-all" type="button">전체 에러 시나리오 실행</button>
          <button class="secondary" id="console-error" type="button">console.error</button>
          <button class="secondary" id="throw-error" type="button">throw Error</button>
          <button class="secondary" id="promise-error" type="button">Promise rejection</button>
          <button class="secondary" id="failed-fetch" type="button">failed fetch</button>
          <button class="secondary" id="dom-burst" type="button">DOM 변경</button>
        </div>
        <ul id="log" aria-live="polite"></ul>
      </section>

      <p class="hint">
        Stop Trace 후 오른쪽 분석 탭의 자동 AI 분석 카드에서 결과를 확인하세요.
      </p>
    </main>

    <script>
      const log = document.getElementById("log");

      function addLog(message) {
        const item = document.createElement("li");
        item.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
        log.prepend(item);
      }

      function emitConsoleError() {
        const payload = {
          component: "DebugPaymentPanel",
          action: "setPolicyInfo",
          expected: "policy.limit number",
          received: { policy: null },
        };

        addLog("console.error 객체 로그 발생");
        console.error("AI_TEST_CONSOLE_OBJECT", payload);
      }

      function calculateCartTotal(cart) {
        return cart.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
      }

      const tracedCalculateCartTotal = window.__AI_FLOW_DEBUG__?.traceFunction
        ? window.__AI_FLOW_DEBUG__.traceFunction(
            {
              name: "calculateCartTotal",
              source: "debug-error.html",
              line: 175,
              column: 7,
            },
            calculateCartTotal
          )
        : calculateCartTotal;

      function throwRuntimeError() {
        addLog("TypeError 발생: cart.items가 null");
        tracedCalculateCartTotal({
          items: null,
          coupon: "SPRING_TEST",
        });
      }

      function rejectPromise() {
        addLog("unhandled promise rejection 발생");
        Promise.resolve().then(() => {
          throw new Error("AI_TEST_PROMISE_REJECTION: 결제 정책 조회 Promise가 실패했습니다.");
        });
      }

      function requestMissingApi() {
        addLog("실패 API 호출 발생");
        fetch("http://127.0.0.1:9/debug-agent-test/missing-policy?id=42").catch(() => undefined);
      }

      function mutateDomBurst() {
        addLog("DOM mutation 45건 발생");
        for (let index = 0; index < 45; index += 1) {
          const item = document.createElement("li");
          item.textContent = `DOM mutation sample ${index + 1}`;
          log.append(item);
        }
      }

      function runAllScenarios() {
        emitConsoleError();
        requestMissingApi();
        mutateDomBurst();
        rejectPromise();

        setTimeout(() => {
          throwRuntimeError();
        }, 150);
      }

      document.getElementById("run-all").addEventListener("click", runAllScenarios);
      document.getElementById("console-error").addEventListener("click", emitConsoleError);
      document.getElementById("throw-error").addEventListener("click", throwRuntimeError);
      document.getElementById("promise-error").addEventListener("click", rejectPromise);
      document.getElementById("failed-fetch").addEventListener("click", requestMissingApi);
      document.getElementById("dom-burst").addEventListener("click", mutateDomBurst);
    </script>
  </body>
</html>
